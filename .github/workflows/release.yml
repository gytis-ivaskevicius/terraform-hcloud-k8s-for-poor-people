name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba492189080f02aab13a89dcd6b8094e8a4a # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500cb3c7416ddb342e18e4ea474100b # v6.0.2
        with:
          persist-credentials: false
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dcfe69d1782dd59e7bb8bce3d2c33e # v6.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            - conventional-changelog-conventionalcommits@9.3.1
